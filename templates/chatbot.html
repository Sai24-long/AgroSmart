<!DOCTYPE html>
<html lang="my">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroBot AI | AgroSmart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Inter:wght@400;600;800&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: { 500: '#10b981', 600: '#059669', 700: '#047857' } }, fontFamily: { sans: ['Inter', 'Padauk', 'sans-serif'] } } }
        }
    </script>
    <style>
        /* Chat စာသားတွေ ပေါ်လာတဲ့ Animation */
        .chat-bubble {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 🎨 Custom Scrollbar Design */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.5);
            /* မီးခိုးရောင် ဖျော့ဖျော့ */
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(16, 185, 129, 0.8);
            /* Hover လုပ်ရင် အစိမ်းရောင် (Brand Color) */
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 font-sans antialiased h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <a href="/" class="text-gray-500 hover:text-brand-600 transition">ပင်မစာမျက်နှာ</a>
            <span class="text-xl font-bold text-gray-900">🤖 AgroBot AI Assistant</span>
        </div>
    </nav>

    <!-- Main Chat Area -->
    <main class="flex-1 overflow-y-auto p-4  w-full flex flex-col">

        <!-- Chat Messages Container -->
        <div id="chat-container" class="flex-1 space-y-4 pb-4">

            <!-- Bot ရဲ့ ပထမဆုံး နှုတ်ဆက်စကား -->
            <div class="flex items-start gap-3 chat-bubble">
                <div
                    class="w-8 h-8 rounded-full bg-brand-500 flex items-center justify-center text-white font-bold shrink-0">
                    A</div>
                <div class="bg-white p-4 rounded-2xl rounded-tl-none shadow-sm border border-gray-100 max-w-[80%]">
                    <p class="text-sm text-gray-700">မင်္ဂလာပါ။ ကျွန်တော်က AgroBot ပါ။ စိုက်ပျိုးရေး၊ သီးနှံအထွက်နှုန်း၊
                        ပိုးမွှားရောဂါနဲ့ ရာသီဥတုအကြောင်း သိချင်တာတွေကို မေးမြန်းနိုင်ပါတယ်။ ဘာကူညီပေးရမလဲခင်ဗျာ။</p>
                </div>
            </div>

        </div>

        <!-- Input Area -->
        <div class="sticky bottom-0 bg-gray-50 pt-2 pb-4">
            <div class="flex gap-2 bg-white p-2 rounded-2xl shadow-lg border border-gray-200">
                <input type="text" id="userInput" placeholder="မေးခွန်းတစ်ခုခုကို ရိုက်ထည့်ပါ..."
                    class="flex-1 bg-transparent px-4 py-2 outline-none text-gray-700"
                    onkeypress="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()" id="sendBtn"
                    class="bg-brand-500 hover:bg-brand-600 text-white px-5 py-2 rounded-xl transition font-semibold flex items-center gap-2">
                    ပို့မည်
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                </button>
            </div>
            <div class="text-center text-xs text-gray-400 mt-2">AI ဖြေကြားချက်များသည် အမြဲတမ်း ၁၀၀% မှန်ကန်ချင်မှ
                မှန်ကန်နိုင်ပါသည်။</div>
        </div>
    </main>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = `flex items-start gap-3 chat-bubble ${isUser ? 'flex-row-reverse' : ''}`;

            const avatar = isUser
                ? `<div class="w-8 h-8 rounded-full bg-gray-600 flex items-center justify-center text-white font-bold shrink-0">U</div>`
                : `<div class="w-8 h-8 rounded-full bg-brand-500 flex items-center justify-center text-white font-bold shrink-0">A</div>`;

            const bubbleClass = isUser
                ? 'bg-brand-500 text-white rounded-tr-none'
                : 'bg-white text-gray-700 rounded-tl-none border border-gray-100 shadow-sm';

            // စာသားထဲမှာ Line Break (Enter) ပါရင် <br> ပြောင်းပေးမယ်
            const formattedText = text.replace(/\n/g, '<br>');

            div.innerHTML = `
                ${avatar}
                <div class="${bubbleClass} p-4 rounded-2xl max-w-[80%]">
                    <p class="text-sm">${formattedText}</p>
                </div>
            `;
            chatContainer.appendChild(div);

            // အောက်ဆုံးကို Auto Scroll ဆွဲမယ်
            window.scrollTo(0, document.body.scrollHeight);
        }

        function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // လယ်သမား ရိုက်ထည့်တဲ့ စာသားကို ပြမယ်
            addMessage(message, true);
            userInput.value = '';

            // Loading ပြတဲ့ Animation
            sendBtn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            sendBtn.disabled = true;
            sendBtn.classList.add('opacity-70');

            // Backend ကို မေးခွန်းပို့မယ်
            fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        addMessage('❌ တောင်းပန်ပါတယ်၊ ခဏလောက် Error ဖြစ်သွားလို့ ထပ်မေးပေးပါ။', false);
                    } else {
                        addMessage(data.reply, false);
                    }
                })
                .catch(() => {
                    addMessage('❌ အင်တာနက် ချိတ်ဆက်မှု မကောင်းပါ။', false);
                })
                .finally(() => {
                    // ခလုတ်ကို ပုံမှန်ပြန်ထားမယ်
                    sendBtn.innerHTML = `ပို့မည် <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>`;
                    sendBtn.disabled = false;
                    sendBtn.classList.remove('opacity-70');
                });
        }
    </script>
</body>

</html>
