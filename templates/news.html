<!DOCTYPE html>
<html lang="my">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>သတင်းနှင့် ရောဂါအချက်အလက် | AgroSmart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Padauk', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            min-height: 100vh;
        }

        .news-content {
            max-height: 120px;
            overflow-y: auto;
            transition: all 0.3s ease;
            padding-right: 5px;
        }

        .news-content::-webkit-scrollbar {
            width: 5px;
        }

        .news-content::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .news-content::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .news-content::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .news-content.expanded {
            max-height: none;
            overflow-y: visible;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-card {
            animation: fadeInUp 0.5s ease-out forwards;
            opacity: 0;
        }
    </style>
</head>

<body class="pb-10">
    <!-- Navbar -->
    <nav class="bg-white/80 backdrop-blur-md shadow-sm p-4 border-b border-gray-100 sticky top-0 z-50">
        <div class="w-full max-w-7xl mx-auto px-4 flex justify-between items-center">
            <!-- 👇 ဒီနေရာမှာ သစ်ရွက်ပုံ Logo လေးနဲ့ AgroSmart စာသားကို ထည့်ထားပါတယ် 👇 -->
            <div class="flex items-center gap-2">
                <span class="text-2xl">🌿</span>
                <span class="text-xl font-bold text-gray-800 tracking-tight">AgroSmart <span
                        class="text-green-600">KyaingTong</span></span>
            </div>

            <a href="/"
                class="text-sm text-gray-600 hover:text-green-600 font-semibold transition flex items-center gap-1 bg-gray-100 px-3 py-1.5 rounded-lg"><i
                    class="fa-solid fa-arrow-left"></i> Dashboard</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="w-full max-w-7xl mx-auto px-4 mt-8">
        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-extrabold text-gray-800 mb-3 drop-shadow-sm">စိုက်ပျိုးရေးသတင်းနှင့်
                ပိုးမွှားရောဂါများ</h1>
            <p class="text-gray-600 text-lg">နောက်ဆုံးရ သတင်းအချက်အလက်များကို အချိန်နှင့်တပြေးညီ လေ့လာပါ။</p>
        </div>

        <div id="newsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 items-stretch">
            <div class="col-span-full text-center py-10 text-gray-500"><i
                    class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-green-500"></i>
                <p>သတင်းများ ရယူနေပါသည်...</p>
            </div>
        </div>
    </main>


    <script>
        window.onload = function () {
            fetch('/api/news')
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('newsList');
                    list.innerHTML = '';

                    if (data.success && data.data.length > 0) {
                        data.data.forEach((item, index) => {
                            let badgeClass = "bg-blue-100 text-blue-700 border border-blue-200";
                            let icon = "fa-circle-info";
                            if (item.category === 'ပိုးမွှားရောဂါ') {
                                badgeClass = "bg-red-100 text-red-700 border border-red-200";
                                icon = "fa-bug";
                            } else if (item.category === 'သတင်း') {
                                badgeClass = "bg-green-100 text-green-700 border border-green-200";
                                icon = "fa-newspaper";
                            }

                            const dateStr = item.created_at.split(' ')[0];
                            let imgSrc = item.image_url ? item.image_url : 'https://via.placeholder.com/400x250?text=No+Image';

                            let isLong = item.content.length > 150;
                            let contentId = `content-${item.id}`;
                            let btnId = `btn-${item.id}`;

                            const div = document.createElement('div');
                            div.className = "animate-card bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden flex flex-col hover:-translate-y-1 hover:shadow-2xl transition-all duration-300 group";
                            div.style.animationDelay = `${index * 0.1}s`;

                            div.innerHTML = `
                                <div class="w-full h-56 relative overflow-hidden shrink-0">
                                    <img src="${imgSrc}" alt="News Image" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.src='https://via.placeholder.com/400x250?text=Image+Error'">
                                    <div class="absolute top-4 left-4">
                                        <span class="${badgeClass} text-[11px] px-3 py-1.5 rounded-lg font-bold uppercase tracking-wider shadow-sm backdrop-blur-md bg-opacity-90">
                                            <i class="fa-solid ${icon} mr-1"></i> ${item.category}
                                        </span>
                                    </div>
                                </div>
                                
                                <div class="p-6 flex flex-col flex-1">
                                    <div class="flex justify-between items-center mb-3">
                                        <span class="text-xs text-gray-400 font-semibold"><i class="fa-regular fa-calendar mr-1"></i> ${dateStr}</span>
                                    </div>
                                    <h3 class="text-xl font-bold text-gray-800 mb-3 leading-tight group-hover:text-green-700 transition">${item.title}</h3>
                                    
                                    <div id="${contentId}" class="news-content text-gray-600 text-sm leading-relaxed whitespace-pre-wrap flex-1">
                                        ${item.content}
                                    </div>
                                    
                                    ${isLong ? `<button id="${btnId}" onclick="toggleContent('${contentId}', '${btnId}')" class="mt-4 w-full bg-brand-50 hover:bg-brand-100 text-brand-700 py-2 rounded-lg font-bold text-sm transition-colors duration-200 flex items-center justify-center gap-2"><i class="fa-solid fa-chevron-down"></i> ပိုမိုကြည့်ရှုရန်</button>` : ''}
                                </div>
                            `;
                            list.appendChild(div);
                        });
                    } else {
                        list.innerHTML = '<div class="col-span-full text-center py-10 text-gray-500">သတင်း မရှိသေးပါ။</div>';
                    }
                });
        };

        function toggleContent(contentId, btnId) {
            const content = document.getElementById(contentId);
            const btn = document.getElementById(btnId);

            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
                btn.innerHTML = '<i class="fa-solid fa-chevron-down"></i> ပိုမိုကြည့်ရှုရန်';
            } else {
                content.classList.add('expanded');
                btn.innerHTML = '<i class="fa-solid fa-chevron-up"></i> အတိုချုံ့ရန်';
            }
        }
    </script>
</body>

</html>
